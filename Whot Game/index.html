<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whot Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="game-container">


     
      <div id="played-card"><img src="whotDeck/whot-back.png" alt=""></div>
      <img src="whotDeck/dec-picture.png" alt="" id="pick-card">
      <div id="cards-left">0</div>
      <div id="player-cards"></div>
      <div id="computer-cards"></div>

      <div id="pick-slide" class="pick-slide"></div>
      <div id="play-slide" class="play-slide"></div>
      <div id="computer-pick-slide" class="computer-pick-slide"><img src="whotDeck/whot-back.png" alt=""></div>
      <div id="computer-play-slide" class="computer-play-slide"></div>
    

      <button id="shownextbtn" class="showbtn">&#xBB;</button>
      <button id="showprevbtn" class="showbtn">&#xAB;</button>

      <div id="cards-more">0</div>
      
    </div>

    <div class="dashboard">
      <div class="dashboardprompt" id="general-prompt"></div>
      <div class="dashboardprompt" id="player-prompt"></div>
      <div class="dashboardprompt" id="computer-prompt"></div>
      <div class="dashboardprompt" id="cards-count"></div>

    </div>
    
   
    <script type="module" src="script.js"></script>
    
  </body>
</html>
